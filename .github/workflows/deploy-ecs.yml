name: Build and Deploy Queues

on:
  push:
    branches: [feature/rabbitmq]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  IMAGE_NAME: cuidado-seguro-rabbitmq

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify application
        working-directory: queues
        run: mvn -B -DskipTests package

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./queues
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy image revision to ECS
        env:
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
          IMAGE_URI: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        run: |
          TASK_DEFINITION_ARN=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition --task-definition "$TASK_DEFINITION_ARN" --query taskDefinition > task-definition.json
          
          jq --arg image "$IMAGE_URI" --arg rabbitmqUser "$RABBITMQ_USER" --arg rabbitmqPassword "$RABBITMQ_PASSWORD" '
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt, .enableFaultInjection) |
            .containerDefinitions |= map(
              if .name == "rabbitmq-server" then
                .environment = (
                  (.environment // [])
                  | map(select(.name != "RABBITMQ_DEFAULT_USER" and .name != "RABBITMQ_DEFAULT_PASS"))
                  + [
                      {name: "RABBITMQ_DEFAULT_USER", value: $rabbitmqUser},
                      {name: "RABBITMQ_DEFAULT_PASS", value: $rabbitmqPassword}
                    ]
                )
              else
                .image = $image |
                .environment = (
                  (.environment // [])
                  | map(select(.name != "SPRING_RABBITMQ_USERNAME" and .name != "SPRING_RABBITMQ_PASSWORD"))
                  + [
                      {name: "SPRING_RABBITMQ_USERNAME", value: $rabbitmqUser},
                      {name: "SPRING_RABBITMQ_PASSWORD", value: $rabbitmqPassword}
                    ]
                )
              end
            )
          ' task-definition.json > next-task-definition.json
          
          NEXT_TASK_DEFINITION_ARN=$(aws ecs register-task-definition --cli-input-json file://next-task-definition.json --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$NEXT_TASK_DEFINITION_ARN" --force-new-deployment
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
